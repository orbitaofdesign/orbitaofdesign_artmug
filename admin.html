<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>오르비타 관리자</title>
<style>
@font-face{font-family:'Paperlogy';src:url('https://cdn.jsdelivr.net/gh/yellopencil/yellopencil-webfonts@v1.17.0/fonts/paperlogy/Paperlogy-4Regular.woff2') format('woff2');font-weight:400;font-display:swap;}
@font-face{font-family:'Paperlogy';src:url('https://cdn.jsdelivr.net/gh/yellopencil/yellopencil-webfonts@v1.17.0/fonts/paperlogy/Paperlogy-5Medium.woff2') format('woff2');font-weight:500;font-display:swap;}
@font-face{font-family:'Paperlogy';src:url('https://cdn.jsdelivr.net/gh/yellopencil/yellopencil-webfonts@v1.17.0/fonts/paperlogy/Paperlogy-7Bold.woff2') format('woff2');font-weight:700;font-display:swap;}
:root{--y:#ffd040;--y2:#fff8dc;--y3:#fffbea;--yb:#ffe79a;--k:#1a1a1a;--g:#666;--g2:#999;--line:#ececec;--bg:#f6f5f2;--red:#d93025;--green:#11a36a;}
*{box-sizing:border-box;}
html,body{margin:0;height:100%;}
body{font-family:'Paperlogy','Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;color:var(--k);background:var(--bg);font-size:14px;line-height:20px;}
button,input,textarea,select{font:inherit;color:inherit;}
button{cursor:pointer;}
.top{position:sticky;top:0;z-index:50;display:flex;align-items:center;gap:8px;height:60px;padding:0 16px;background:#000;color:#fff;}
.brand{display:flex;align-items:center;gap:10px;font-size:16px;font-weight:700;letter-spacing:.5px;white-space:nowrap;}
.brand i{font-style:normal;color:var(--y);}
.brand small{font-size:12px;font-weight:500;color:#aaa;letter-spacing:0;}
.status{min-width:0;flex:0 1 auto;margin-left:8px;display:flex;align-items:center;gap:6px;font-size:13px;color:#ccc;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.status span{overflow:hidden;text-overflow:ellipsis;}.status b{display:inline-block;width:8px;height:8px;border-radius:50%;background:#666;flex:none;}
.status.dirty b{background:var(--y);}
.status.ok b{background:var(--green);}
.status.err b{background:var(--red);}
.sp{flex:1;}
.tb{flex:none;height:36px;padding:0 12px;border-radius:9px;border:1px solid #333;background:#111;color:#eee;font-size:13px;font-weight:500;white-space:nowrap;transition:background-color .15s,border-color .15s;}
.tb:hover{background:#1f1f1f;border-color:#555;}
.tb.pri{background:var(--y);border-color:var(--y);color:#1a1a1a;font-weight:700;}
.tb.pri:hover{background:#ffc61a;}
.tb:disabled{opacity:.45;cursor:default;}
.tb.icon{width:36px;padding:0;font-size:16px;}
.wrap{display:flex;height:calc(100% - 60px);}
.nav{flex:none;width:188px;padding:16px 10px;background:#fff;border-right:1px solid var(--line);display:flex;flex-direction:column;gap:4px;}
.nav button{display:flex;align-items:center;gap:10px;height:42px;padding:0 12px;border:0;border-radius:10px;background:transparent;text-align:left;font-size:14px;font-weight:500;color:var(--g);}
.nav button:hover{background:var(--y2);color:var(--k);}
.nav button.on{background:var(--y3);color:var(--k);font-weight:700;}
.nav button.on::before{background:var(--y);}
.nav button::before{content:'';width:6px;height:6px;border-radius:50%;background:#d9d9d9;flex:none;}
.nav{overflow-y:auto;}
.navsub{display:flex;flex-direction:column;gap:2px;margin:0 0 4px;padding-left:14px;}
.navsub button{height:34px;font-size:13px;}
.navsub button::before{width:4px;height:4px;}
.navsep{height:1px;margin:6px 4px;background:var(--line);flex:none;}
.secgo{display:flex;align-items:center;gap:8px;margin:0 0 10px;padding:10px 12px;border-radius:10px;background:var(--y3);font-size:12px;line-height:18px;color:var(--k);}
.secgo button{flex:none;margin-left:auto;height:28px;padding:0 10px;border:1px solid var(--line);border-radius:8px;background:#fff;font-size:12px;font-weight:700;}
.nav .hint{margin-top:auto;padding:12px;border-radius:10px;background:var(--bg);font-size:12px;line-height:18px;color:var(--g);}
.main{flex:1;min-width:0;overflow:hidden;position:relative;}
.view{position:absolute;inset:0;display:none;}
.view.on{display:flex;}
/* 문구 */
.pv{flex:1;min-width:0;display:flex;flex-direction:column;}
.pvbar{display:flex;align-items:center;gap:8px;height:48px;padding:0 16px;background:#fff;border-bottom:1px solid var(--line);font-size:13px;color:var(--g);}
.seg{display:inline-flex;padding:3px;border-radius:9px;background:var(--bg);}
.seg button{height:28px;padding:0 12px;border:0;border-radius:7px;background:transparent;font-size:12px;font-weight:500;color:var(--g);}
.seg button.on{background:#fff;color:var(--k);font-weight:700;box-shadow:0 1px 3px rgba(0,0,0,.08);}
.vm-m .pvbar{background:#fffbea;}.vm-m #segW button.on{background:#ffd040;}
.vmtag{display:none;flex:none;height:24px;padding:0 10px;border-radius:999px;background:#1a1a1a;color:#ffd040;font-size:12px;font-weight:700;line-height:24px;}.vm-m .vmtag{display:inline-block;}.vm-m .pvhelp{display:none;}
.pvbox{flex:1;overflow:auto;display:flex;justify-content:center;background:#e9e8e4;}
.pvbox iframe{display:block;width:100%;height:100%;border:0;background:#fff;}
.pvbox.mobile iframe{width:390px;box-shadow:0 0 0 1px #ddd;}
.side{flex:none;width:340px;display:flex;flex-direction:column;background:#fff;border-left:1px solid var(--line);}
.side h3{margin:0;padding:14px 16px 10px;font-size:15px;}
.search{margin:0 16px 10px;height:36px;padding:0 12px;border:1px solid #e0e0e0;border-radius:9px;background:#fff;}
.search:focus,.f input:focus,.f textarea:focus,.dlg input:focus,.dlg textarea:focus{outline:none;border-color:var(--y);box-shadow:0 0 0 3px rgba(255,208,64,.3);}
.filters{display:flex;gap:6px;padding:0 16px 10px;}
.chip{height:28px;padding:0 10px;border:1px solid #e0e0e0;border-radius:14px;background:#fff;font-size:12px;color:var(--g);}
.chip.on{border-color:var(--y);background:var(--y3);color:var(--k);font-weight:700;}
.list{flex:1;overflow:auto;padding:0 8px 16px;}
.lsec{position:sticky;top:0;z-index:1;margin:8px 0 2px;padding:6px 8px;background:#fff;font-size:12px;font-weight:700;color:var(--g2);letter-spacing:.3px;}
.lrow{display:block;width:100%;padding:8px 10px;border:0;border-radius:9px;background:transparent;text-align:left;}
.lrow:hover{background:var(--y2);}
.lrow .t{display:block;font-size:13px;line-height:19px;color:var(--k);overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;}
.lrow .m{display:flex;align-items:center;gap:6px;margin-top:2px;font-size:11px;line-height:16px;color:var(--g2);}
.lrow.ch .t{font-weight:700;}
.lrow.ch .m::before{content:'수정됨';padding:0 6px;border-radius:8px;background:var(--y);color:#1a1a1a;font-weight:700;}
.lrow .rv{margin-left:auto;padding:0 6px;border:0;border-radius:6px;background:transparent;color:var(--g);font-size:11px;text-decoration:underline;}
.arow{padding:8px 10px;}
.arow label{display:flex;align-items:center;gap:6px;font-size:11px;color:var(--g2);margin-bottom:4px;}
.arow textarea{width:100%;min-height:38px;padding:8px 10px;border:1px solid #e0e0e0;border-radius:8px;resize:vertical;font-size:13px;line-height:19px;}
.arow.ch textarea{border-color:var(--y);background:var(--y3);}
/* 공통 폼 */
.scroll{flex:1;overflow:auto;padding:24px;}
.pagehead{display:flex;align-items:flex-end;gap:12px;margin:0 auto 16px;max-width:1100px;}
.pagehead h2{margin:0;font-size:20px;line-height:28px;}
.pagehead p{margin:0;font-size:13px;color:var(--g);}
.card{max-width:1100px;margin:0 auto 12px;padding:18px 20px;background:#fff;border:1px solid var(--line);border-radius:14px;}
.card h4{display:flex;align-items:center;gap:8px;margin:0 0 12px;font-size:16px;line-height:24px;}
.card h4 .cat{color:var(--y);font-weight:800;}
.card h4 .cat.chz{color:#00c482;}
.grid2{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin-bottom:12px;}
.f{display:flex;flex-direction:column;gap:4px;}
.f>span{font-size:12px;color:var(--g);}
.f input,.f textarea,.f select{height:38px;padding:0 10px;border:1px solid #e0e0e0;border-radius:8px;background:#fff;font-size:13px;}
.f textarea{height:auto;min-height:38px;padding:8px 10px;resize:vertical;line-height:19px;}
.f.ch input,.f.ch textarea{border-color:var(--y);background:var(--y3);}
.strs{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px 12px;}
.strs .f>span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.note{font-size:12px;line-height:18px;color:var(--g);}
details.more>summary{cursor:pointer;font-size:13px;font-weight:700;color:var(--g);padding:4px 0;}
details.more[open]>summary{margin-bottom:10px;}
/* 포트폴리오 */
.pfw{display:flex;flex:1;min-width:0;}
.tree{flex:none;width:260px;overflow:auto;padding:16px 10px;background:#fff;border-right:1px solid var(--line);}
.tree .c{margin:10px 6px 4px;font-size:12px;font-weight:700;color:var(--g2);}
.tree button{display:flex;align-items:center;gap:8px;width:100%;min-height:36px;padding:6px 10px;border:1px solid transparent;border-radius:9px;background:transparent;text-align:left;font-size:13px;color:var(--k);}
.tree button:hover{background:var(--y2);}
.tree button.on{background:var(--y3);font-weight:700;}
.tree button .n{margin-left:auto;font-size:11px;color:var(--g2);}
.tree button.drop{border-color:var(--y);border-style:dashed;background:#fffdf3;}
.tree button.nodrop{opacity:.35;}
.pfmain{flex:1;min-width:0;display:flex;flex-direction:column;}
.pfbar{display:flex;flex-wrap:wrap;align-items:center;gap:8px;padding:14px 20px;background:#fff;border-bottom:1px solid var(--line);}
.pfbar h3{margin:0 8px 0 0;font-size:16px;line-height:24px;}
.btn{height:34px;padding:0 12px;border:1px solid #e0e0e0;border-radius:8px;background:#fff;font-size:13px;font-weight:500;white-space:nowrap;}
.btn:hover{border-color:var(--y);}
.btn.y{background:var(--y);border-color:var(--y);font-weight:700;}
.btn.y:hover{background:#ffc61a;}
.btn.red{color:var(--red);}
.fcat{color:#e0a800;font-weight:800;}.fcat.chz{color:#00b377;}
.fe-pop{max-width:900px;margin:0 auto;padding:22px 24px;background:#fff;border:1px solid var(--line);border-radius:16px;box-shadow:0 8px 24px rgba(0,0,0,.04);}
.fe-head{display:flex;flex-wrap:wrap;gap:10px;margin-bottom:10px;}
.fe-w0{width:90px;}.fe-w1{width:170px;}.fe-w2{flex:1;min-width:200px;}.fe-w3{flex:2;min-width:240px;}
.fe-sub{margin:6px 0 6px;font-size:12px;font-weight:700;color:var(--g);}
.fe-chips{display:flex;flex-wrap:wrap;gap:6px;align-items:center;padding-bottom:14px;margin-bottom:6px;border-bottom:1px solid var(--line);}
.fe-chip{display:inline-flex;align-items:center;border:1px solid #e0e0e0;border-radius:16px;background:#fafafa;padding:0 4px 0 10px;}
.fe-chip input{width:140px;height:30px;border:0;background:transparent;font-size:13px;}
.fe-chip button{border:0;background:transparent;color:var(--g2);font-size:12px;width:22px;height:22px;border-radius:50%;}
.fe-chip button:hover{background:#fde8e6;color:var(--red);}
.btn.fe-sm{height:30px;font-size:12px;}
.fe-q{position:relative;margin-top:12px;padding:14px 14px 12px;border:1px solid #ececec;border-radius:12px;background:#fff;}
.fe-q-sec{background:var(--bg);}
.fe-q-page{border-color:var(--yb);background:var(--y3);}
.fe-qtop{display:flex;align-items:center;gap:8px;}
.fe-badge{flex:none;padding:0 8px;height:22px;line-height:22px;border-radius:11px;background:#1a1a1a;color:#fff;font-size:11px;font-weight:700;}
.fe-q-sec .fe-badge{background:#888;}.fe-q-page .fe-badge{background:var(--y);color:#1a1a1a;}
.fe-q .fe-qtop select[data-qf=type]{font-weight:700;background:#1a1a1a;color:#fff;border-color:#1a1a1a;}
.fe-qtop select,.fe-o select,.fe-cond select,.fe-addq select{height:34px;padding:0 8px;border:1px solid #e0e0e0;border-radius:8px;background:#fff;font-size:13px;}
.fe-qlabel{flex:1;min-width:0;height:36px;padding:0 10px;border:1px solid #e0e0e0;border-radius:8px;font-size:15px;font-weight:700;}
.fe-acts{display:flex;gap:4px;flex:none;}
.fe-acts button{width:30px;height:30px;border:1px solid #e0e0e0;border-radius:8px;background:#fff;font-size:11px;color:var(--g);}
.fe-acts button:hover:not(:disabled){border-color:var(--y);color:var(--k);}
.fe-acts button.del:hover{border-color:var(--red);color:var(--red);}
.fe-acts button:disabled{opacity:.3;}
.fe-pn{margin:8px 0 0;}
.fe-qmeta{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px;}
.fe-qmeta .f input{height:32px;}
.fe-cond{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin-top:10px;font-size:12px;color:var(--g);}
.fe-cond>span:first-child{font-weight:700;}
.fe-ck{display:inline-flex;flex-wrap:wrap;gap:4px 10px;}
.fe-ck label{display:inline-flex;align-items:center;gap:4px;font-size:12px;color:var(--k);}
.fe-opts{margin-top:10px;padding:10px;border-radius:10px;background:#fafafa;display:flex;flex-direction:column;gap:8px;align-items:flex-start;}
.fe-o{width:100%;box-sizing:border-box;display:flex;flex-wrap:wrap;align-items:center;gap:6px;padding:8px;border:1px solid #eee;border-radius:10px;background:#fff;}
.fe-ob{flex:none;width:18px;text-align:center;color:var(--g2);}
.fe-ol{flex:1;min-width:160px;height:34px;padding:0 10px;border:1px solid #e0e0e0;border-radius:8px;font-size:14px;}
.fe-op{width:110px;height:34px;padding:0 8px;border:1px solid #e0e0e0;border-radius:8px;font-size:13px;}
.fe-op:disabled{background:#f4f4f4;}
.fe-oshow{width:100%;padding-left:24px;font-size:11px;color:var(--g2);}
.fe-oshow b{color:var(--g);font-weight:600;}
.fe-per{width:100%;display:flex;flex-wrap:wrap;align-items:center;gap:8px;padding-left:24px;font-size:12px;color:var(--g);}
.fe-per input,.fe-per select{height:30px;padding:0 6px;border:1px solid #e0e0e0;border-radius:6px;font-size:12px;}
.fe-od{width:100%;padding-left:24px;font-size:12px;color:var(--g);}
.fe-od summary{cursor:pointer;}
.fe-od .fe-qmeta{margin-top:6px;}
.fe-addq{display:flex;align-items:center;gap:8px;margin-top:16px;}
.pr-cols{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;max-width:1100px;margin:0 auto 12px;align-items:start;}
.pr-cols .card{margin:0;max-width:none;}
.pr-cols3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px 24px;align-items:start;}
.pr-it{padding:10px 0;border-top:1px solid var(--line);}
.pr-col h4+.pr-it,.pr-cols3>.pr-it{border-top:0;padding-top:0;}
.pr-name{display:flex;align-items:center;gap:6px;margin-bottom:4px;font-size:13px;font-weight:700;}
.pr-go{margin-left:auto;width:24px;height:24px;border:0;border-radius:6px;background:transparent;font-size:16px;line-height:1;color:var(--g2);}
.pr-go:hover{background:var(--y2);color:var(--k);}
.pr-row{display:flex;align-items:center;gap:8px;padding:3px 0;font-size:13px;}
.pr-l{flex:1;min-width:0;display:flex;flex-direction:column;line-height:17px;word-break:keep-all;}
.pr-l small{font-size:11px;color:var(--g2);line-height:15px;}
.pr-in{display:inline-flex;align-items:center;gap:3px;flex:none;}
.pr-in input{width:96px;height:30px;padding:0 8px;border:1px solid #e0e0e0;border-radius:8px;text-align:right;font-size:13px;}
.pr-in i{font-style:normal;width:14px;color:var(--g);font-size:12px;}
@media (max-width:1250px){.pr-cols,.pr-cols3{grid-template-columns:minmax(0,1fr) minmax(0,1fr);}}
@media (max-width:980px){.pr-cols,.pr-cols3{grid-template-columns:minmax(0,1fr);}}
.tippos{display:flex;flex-direction:column;gap:6px;margin:0 0 12px;}
.tippos label{display:flex;align-items:flex-start;gap:10px;padding:10px 12px;border:1px solid #e6e6e6;border-radius:10px;cursor:pointer;}
.tippos label:has(input:checked){border-color:var(--y);background:var(--y3);}
.tippos input{margin-top:3px;accent-color:#1a1a1a;}
.tippos span{display:flex;flex-direction:column;gap:2px;font-size:13px;}
.tippos small{font-size:12px;color:var(--g);}
.sumbox{margin:0 0 12px;padding:10px 12px;border-radius:10px;background:var(--y3);border:1px solid var(--yb);font-size:13px;max-height:220px;overflow:auto;}
.sumbox ul{margin:6px 0 0;padding-left:18px;}
.sumbox li{margin:2px 0;line-height:18px;}
#bDelM{margin-left:auto;flex:none;height:32px;padding:0 12px;font-size:13px;}
#bDelM.on{background:#e53935;border-color:#e53935;color:#fff;}
#bDelM+#bTip{margin-left:0;}
#bTip{margin-left:auto;flex:none;height:32px;padding:0 12px;font-size:13px;}
.btn.red:hover{border-color:var(--red);}
.btn:disabled{opacity:.4;cursor:default;}
.names{display:flex;flex-wrap:wrap;gap:8px;padding:10px 20px;background:#fff;border-bottom:1px solid var(--line);}
.names .f{width:200px;}
.banner{display:none;align-items:center;gap:10px;padding:10px 20px;background:var(--y3);border-bottom:1px solid var(--yb);font-size:13px;}
.banner.on{display:flex;}
.items{flex:1;overflow:auto;padding:20px;display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));align-content:start;gap:14px;}
.it{position:relative;display:flex;flex-direction:column;background:#fff;border:1px solid var(--line);border-radius:12px;overflow:hidden;transition:border-color .15s,box-shadow .15s,transform .15s;}
.it:hover{border-color:var(--yb);}
.it.sel{border-color:var(--y);box-shadow:0 0 0 3px rgba(255,208,64,.45);}
.it.dragging{opacity:.4;}
.it.dropl{box-shadow:-4px 0 0 0 var(--y);}
.it .ph{position:relative;aspect-ratio:4/3;background:#fafafa;display:flex;align-items:center;justify-content:center;cursor:grab;overflow:hidden;}
.it .ph img,.it .ph video{max-width:100%;max-height:100%;object-fit:contain;display:block;}
.it .ph .multi{position:absolute;right:6px;bottom:6px;padding:0 6px;border-radius:8px;background:rgba(0,0,0,.65);color:#fff;font-size:11px;line-height:18px;}
.it .ph .new{position:absolute;left:6px;top:6px;padding:0 6px;border-radius:8px;background:var(--y);font-size:11px;font-weight:700;line-height:18px;}
.it .ix{position:absolute;left:6px;bottom:6px;min-width:22px;padding:0 6px;border-radius:11px;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.15);font-size:11px;font-weight:700;line-height:22px;text-align:center;}
.it .bd{display:flex;flex-direction:column;gap:6px;padding:10px;}
.it .bd input{height:30px;padding:0 8px;border:1px solid #e8e8e8;border-radius:7px;font-size:12px;}
.it .acts{display:flex;gap:4px;}
.it .acts button{flex:1;height:28px;padding:0;border:1px solid #e8e8e8;border-radius:7px;background:#fff;font-size:12px;}
.it .acts button:hover{border-color:var(--y);}
.it .acts button.del:hover{border-color:var(--red);color:var(--red);}
.empty{grid-column:1/-1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;height:220px;border:1.5px dashed #ddd;border-radius:14px;color:var(--g2);font-size:14px;text-align:center;}
.empty b{color:var(--k);}
.drophint{outline:2px dashed var(--y);outline-offset:-8px;}
.thw{position:relative;margin:0 0 12px;background:#f6f5f2;border-radius:10px;overflow:hidden;touch-action:none;user-select:none;}
.thw canvas{display:block;width:100%;height:auto;}
.thbox{position:absolute;box-sizing:border-box;border:2px solid #ffd040;box-shadow:0 0 0 9999px rgba(0,0,0,.45);cursor:grab;}
.thbox:active{cursor:grabbing;}
.throw{display:flex;align-items:center;gap:12px;margin-bottom:12px;}
.thprev{flex:none;width:96px;height:96px;border-radius:10px;border:1px solid #ececec;background:#fafafa;}
.throw .f{flex:1;}
.throw input[type=range]{width:100%;accent-color:#ffd040;}
.ordl{display:flex;flex-wrap:wrap;gap:10px;margin:0 0 4px;}

.ordi img{max-width:100%;max-height:100%;object-fit:contain;pointer-events:none;}
.ordi .n{position:absolute;left:10px;top:10px;min-width:20px;padding:0 6px;border-radius:10px;background:#1a1a1a;color:#ffd040;font-size:11px;font-weight:700;line-height:20px;text-align:center;}
.ordi .ab{display:flex;gap:4px;}
.ordi .ab button{flex:1;height:26px;padding:0;border:1px solid #e8e8e8;border-radius:6px;background:#fff;font-size:13px;}
.ordi .ab button:hover:not(:disabled){border-color:#ffd040;}
.ordi .ab button:disabled{opacity:.3;cursor:default;}
.it .ph,.it .bd{flex:none;}
.items{grid-auto-rows:max-content;}
.it.hid .ph img,.it.hid .ph video{opacity:.35;filter:grayscale(.6);}
.it .ph .hidb{position:absolute;right:6px;top:6px;padding:0 8px;border-radius:9px;background:#1a1a1a;color:#fff;font-size:11px;font-weight:700;line-height:20px;}
.it .vis{display:flex;align-items:center;gap:8px;font-size:12px;color:#666;cursor:pointer;user-select:none;}
.it .vis input{appearance:none;-webkit-appearance:none;flex:none;position:relative;width:34px;height:20px;margin:0;border-radius:10px;background:#d6d6d6;cursor:pointer;transition:background-color .15s;}
.it .vis input::after{content:'';position:absolute;left:2px;top:2px;width:16px;height:16px;border-radius:50%;background:#fff;box-shadow:0 1px 2px rgba(0,0,0,.2);transition:transform .15s;}
.it .vis input:checked{background:#ffd040;}
.it .vis input:checked::after{transform:translateX(14px);}
.it .vis input:checked+span{color:#1a1a1a;font-weight:700;}
.ordadd{width:118px;min-height:146px;border:1.5px dashed #d8d8d8;border-radius:10px;background:#fafafa;color:#666;font-size:13px;font-weight:700;}
.ordadd:hover:not(:disabled){border-color:#ffd040;background:#fffbea;color:#1a1a1a;}
.ordadd:disabled{opacity:.6;cursor:default;}
.lgw{display:flex;gap:16px;align-items:flex-start;margin-bottom:12px;}
.lgcrop{position:relative;flex:1;min-width:0;background:repeating-conic-gradient(#eee 0 25%,#fff 0 50%) 0 0/16px 16px;border-radius:10px;overflow:hidden;touch-action:none;user-select:none;}
.lgcrop canvas{display:block;width:100%;height:auto;}
.lgbox{position:absolute;box-sizing:border-box;border:2px solid #ffd040;box-shadow:0 0 0 9999px rgba(0,0,0,.4);cursor:move;}
.lgbox i{position:absolute;width:14px;height:14px;background:#ffd040;border:2px solid #fff;border-radius:50%;}
.lgbox i[data-h=nw]{left:-2px;top:-2px;cursor:nwse-resize;}.lgbox i[data-h=ne]{right:-2px;top:-2px;cursor:nesw-resize;}
.lgbox i[data-h=sw]{left:-2px;bottom:-2px;cursor:nesw-resize;}.lgbox i[data-h=se]{right:-2px;bottom:-2px;cursor:nwse-resize;}
.lgbox i{width:18px;height:18px;}
.lgside{flex:none;width:200px;display:flex;flex-direction:column;gap:8px;}

.lgside input[type=range]{width:100%;accent-color:#ffd040;}
.cbe{display:flex;gap:18px;align-items:flex-start;}

@media (max-width:860px){.nav{width:64px;padding:12px 6px;}.nav button{justify-content:center;padding:0;font-size:0;}.nav button::before{width:8px;height:8px;}.nav .hint{display:none;}.navsub,.navsep{display:none;}.side{display:none;}.tree{width:180px;}.strs{grid-template-columns:minmax(0,1fr);}.top .tb span{display:none;}}

<div class="ov" id="ov"><div class="dlg" id="dlg" role="dialog" aria-modal="true"></div></div>
<div class="toast" id="toast" role="status"></div>
<script>
(function(){
'use strict';
/* ===== 설정 ===== */
var CFG={owner:'orbitaofdesign',repo:'orbitaofdesign_artmug',branch:'main',site:'https://orbitaofdesign.github.io/orbitaofdesign_artmug/'};
try{var sc=JSON.parse(localStorage.getItem('orb.cfg')||'null');if(sc)Object.keys(sc).forEach(function(k){if(sc[k])CFG[k]=sc[k];});}catch(e){}
var TOKEN='';try{TOKEN=localStorage.getItem('orb.token')||'';}catch(e){}
var FOLDER={'화면 오버레이':'overlay','스케줄표':'schedule','포스터':'poster','PPT':'ppt','로고':'logo','배너':'banner','썸네일':'thumb','채널아트':'channel','팬카페':'fancafe','ETC':'etc'};
var $=function(id){return document.getElementById(id);};
function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});}
function clone(o){return JSON.parse(JSON.stringify(o));}
function toast(t,ms){var e=$('toast');e.textContent=t;e.classList.add('on');clearTimeout(toast.t);toast.t=setTimeout(function(){e.classList.remove('on');},ms||2600);}
function plain(h){var d=document.createElement('div');d.innerHTML=String(h||'').replace(/<br\s*\/?>/gi,' ');return d.textContent.replace(/\s+/g,' ').trim();}
$('repoName').textContent=CFG.owner+'/'+CFG.repo;

/* ===== 상태 ===== */
var draft=empty(),base=null,baseSha=null,dirty=false,O=null,files={},urls={};
function empty(){return {v:1,texts:{},attrs:{},items:{map:{},byId:{}},pf:null,collab:null,form:null,calc:null,hidden:[],m:{texts:{},attrs:{},hide:[],show:[]}};}
function norm(c){c=c&&typeof c==='object'?c:{};var d=empty();d.texts=c.texts||{};d.attrs=c.attrs||{};d.items=c.items||{map:{},byId:{}};d.items.map=d.items.map||{};d.items.byId=d.items.byId||{};d.pf=Array.isArray(c.pf)?c.pf:null;d.collab=Array.isArray(c.collab)?c.collab:null;d.form=Array.isArray(c.form)?c.form:null;d.calc=c.calc&&typeof c.calc==='object'?c.calc:null;d.hidden=Array.isArray(c.hidden)?c.hidden:[];var m=c.m&&typeof c.m==='object'?c.m:{};d.m={texts:m.texts||{},attrs:m.attrs||{},hide:Array.isArray(m.hide)?m.hide:[],show:Array.isArray(m.show)?m.show:[]};return d;}
function setStatus(t,cls){var s=$('status');s.className='status'+(cls?' '+cls:'');$('statusT').textContent=t;}
function changed(){dirty=true;setStatus('반영 안 된 변경 사항 있음','dirty');autosave();}
var asT=null;function autosave(){clearTimeout(asT);asT=setTimeout(function(){saveLocal(true);},800);}

/* ===== 임시 저장 (이 브라우저) ===== */
var DB=null;
function db(){if(DB)return DB;DB=new Promise(function(res,rej){var r=indexedDB.open('orbita-admin',1);r.onupgradeneeded=function(){r.result.createObjectStore('files');};r.onsuccess=function(){res(r.result);};r.onerror=function(){rej(r.error);};});return DB;}
function idb(mode,fn){return db().then(function(d){return new Promise(function(res,rej){var tx=d.transaction('files',mode),st=tx.objectStore('files'),out=fn(st);tx.oncomplete=function(){res(out&&out.result!==undefined?out.result:out);};tx.onerror=function(){rej(tx.error);};});});}
function saveLocal(silent){
  try{localStorage.setItem('orb.draft',JSON.stringify({at:Date.now(),baseSha:baseSha,draft:draft,files:Object.keys(files)}));}catch(e){if(!silent)toast('임시 저장 공간이 부족해요. 파일로 저장해 주세요.');return;}
  idb('readwrite',function(st){st.clear();Object.keys(files).forEach(function(p){st.put(files[p],p);});}).catch(function(){});
  if(!silent)toast('이 브라우저에 임시 저장했어요.');
}
function loadLocal(){try{return JSON.parse(localStorage.getItem('orb.draft')||'null');}catch(e){return null;}}
function clearLocal(){try{localStorage.removeItem('orb.draft');}catch(e){}idb('readwrite',function(st){st.clear();}).catch(function(){});}

/* ===== GitHub ===== */
function api(path,opt){opt=opt||{};var h={'Accept':'application/vnd.github+json'};if(TOKEN)h.Authorization='Bearer '+TOKEN;if(opt.body)h['Content-Type']='application/json';
  return fetch('https://api.github.com/repos/'+CFG.owner+'/'+CFG.repo+path,{method:opt.method||'GET',headers:h,body:opt.body?JSON.stringify(opt.body):undefined,cache:'no-store'}).then(function(r){
    if(r.status===404&&opt.allow404)return null;
    if(!r.ok)return r.json().catch(function(){return {};}).then(function(j){var e=new Error(j.message||('HTTP '+r.status));e.status=r.status;throw e;});
    return r.status===204?null:r.json();});}
function b64dec(s){var bin=atob(s.replace(/\s/g,''));var u=new Uint8Array(bin.length);for(var i=0;i<bin.length;i++)u[i]=bin.charCodeAt(i);return new TextDecoder().decode(u);}
function b64str(s){var u=new TextEncoder().encode(s),bin='';for(var i=0;i<u.length;i+=0x8000)bin+=String.fromCharCode.apply(null,u.subarray(i,i+0x8000));return btoa(bin);}
function blob64(b){return new Promise(function(res,rej){var r=new FileReader();r.onload=function(){res(String(r.result).split(',')[1]);};r.onerror=rej;r.readAsDataURL(b);});}
function loadRemote(ref){
  return api('/contents/content.json'+(ref?'?ref='+ref:'?ref='+CFG.branch),{allow404:true}).then(function(j){
    if(!j)return {c:empty(),sha:null};return {c:norm(JSON.parse(b64dec(j.content))),sha:j.sha};
  }).catch(function(e){
    /* API를 못 쓰면(요청 한도 등) 사이트의 파일로 */
    return fetch('content.json?t='+Date.now(),{cache:'no-store'}).then(function(r){return r.ok?r.json():null;}).then(function(c){return {c:norm(c),sha:undefined,warn:e.message};});
  });
}

/* ===== 미리보기 연결 ===== */
var previewScroll=0,needReload=false;
window.ORBITA_ADMIN={
  draft:function(){var d=clone(draft);if(d.pf)d.pf=mapPaths(d.pf,function(p){return urls[p]||p;});if(d.collab)d.collab.forEach(function(c){if(c.img&&urls[c.img])c.img=urls[c.img];});return d;},
  ready:function(o){O=o;if(delOn&&O.setDelMode)O.setDelMode(true);updDelCount();try{$('pv').contentWindow.scrollTo(0,previewScroll);}catch(e){}buildTextList();markPreview();if(!pfReady)initPf();if(pendingOpen&&O.openItem){var po=pendingOpen;pendingOpen=null;setTimeout(function(){O.openItem(po);},300);}},
  onText:function(key,html){setTextAll(key,html,true);},
  onHide:function(key,on){setHid(key,on);changed();updDelCount();if(fl==='del')buildTextList();},
  onFocus:function(key){var r=document.querySelector('.lrow[data-k="'+cssq(key)+'"]');if(r)r.scrollIntoView({block:'nearest'});},
  editAttr:function(key){editAttr(key);},
  editUtip:function(cur,cb){
    dialog('<h3>ⓘ 말풍선 문구</h3><p>직접 넣은 ⓘ예요. 문구를 바꾸거나 지울 수 있어요.</p><label class="f"><span>말풍선 문구</span><textarea id="dA" rows="3">'+esc(cur)+'</textarea></label><div class="row"><button class="btn red" id="dDel">ⓘ 지우기</button><span style="flex:1"></span><button class="btn" data-x>취소</button><button class="btn y" id="dOk">적용</button></div>');
    var t=$('dA');t.focus();t.select();
    $('dDel').onclick=function(){cb(null);closeDlg();toast('ⓘ를 지웠어요.');};
    $('dOk').onclick=function(){var v=t.value.trim();if(!v){t.focus();return;}cb(v);closeDlg();};
  }
};
/* 지우기 모드 */

/* 이미지 자동 크기 조절 · 압축 */
var MAXW={single:1920,ca:2560,soop:1440,deck:1920,row:900,set:1600,cafe:1920};
function stamp(){var d=new Date(),p=function(n){return (n<10?'0':'')+n;};return String(d.getFullYear()).slice(2)+p(d.getMonth()+1)+p(d.getDate())+'-'+p(d.getHours())+p(d.getMinutes())+p(d.getSeconds())+'-'+Math.random().toString(36).slice(2,6);}
function folderOf(b){var it=b.items[0],p=it&&(it.full||it.src||(it.set&&it.set[0])||(it.cafe&&it.cafe[0].full)||(it.pages&&it.pages[0].full));if(p&&/^portfolio\//.test(p)&&!/^blob:/.test(p))return p.replace(/\/[^\/]*$/,'');return 'portfolio/'+b.folder;}
function keep(path,blob){files[path]=blob;urls[path]=URL.createObjectURL(blob);return path;}
function processFile(f,b,fi){
  var dir=folderOf(b),name=dir+'/'+(FOLDER[b.objs[0].name]||'item')+'-'+stamp()+(fi?'-'+(fi+1):'');

    nd.filter(function(x){return nb.indexOf(x)<0;}).forEach(function(x){L.push('협업 작가 · 카드 추가: '+x);});

    KD.forEach(function(c){var o=KB.filter(function(x){return x.name===c.name;})[0];if(o&&JSON.stringify(o)!==JSON.stringify(c)){var w=[];['tag','color','url','text','note','img'].forEach(function(p){if((o[p]||'')!==(c[p]||''))w.push({tag:'태그',color:'색',url:'링크',text:'설명',note:'안내',img:'사진'}[p]);});if(w.length)L.push('협업 작가 · '+c.name+' '+w.join('·')+' 수정');}});
    if(nb.filter(function(x){return nd.indexOf(x)>-1;}).join()!==nd.filter(function(x){return nb.indexOf(x)>-1;}).join())L.push('협업 작가 · 카드 순서 변경');
  }
  /* 포트폴리오 */
  var dfP=(O&&O.defaults&&O.defaults.pf)||[],PB=B.pf||dfP,PD=D.pf||dfP;
  if(JSON.stringify(PB)!==JSON.stringify(PD)){
    function srcs(pf){var m={};(function w(x,path){if(Array.isArray(x))x.forEach(function(y){w(y,path);});else if(x&&typeof x==='object'){var p2=x.name||x.label?path.concat([x.name||x.label]):path;if(x.src)m[x.src]=path.join(' › ');Object.keys(x).forEach(function(k){if(typeof x[k]==='object')w(x[k],p2);});}})(pf,[]);return m;}
    var sb=srcs(PB),sd=srcs(PD),ad={},rm={};
    Object.keys(sd).forEach(function(x){if(!sb[x]){var g=sd[x]||'포트폴리오';ad[g]=(ad[g]||0)+1;}});
    Object.keys(sb).forEach(function(x){if(!sd[x]){var g=sb[x]||'포트폴리오';rm[g]=(rm[g]||0)+1;}});
    Object.keys(ad).forEach(function(g){L.push('포트폴리오 · '+g+' 샘플 '+ad[g]+'개 추가');});
    Object.keys(rm).forEach(function(g){L.push('포트폴리오 · '+g+' 샘플 '+rm[g]+'개 삭제');});
    if(!Object.keys(ad).length&&!Object.keys(rm).length)L.push('포트폴리오 · 순서·공개 여부·이름 등 수정');
  }
  return L;
}
function logEntry(memo,lines){var d=new Date(),p=function(n){return (n<10?'0':'')+n;};
  return '## '+d.getFullYear()+'-'+p(d.getMonth()+1)+'-'+p(d.getDate())+' '+p(d.getHours())+':'+p(d.getMinutes())+(memo?' · '+memo:'')+'\n'+(lines.length?lines.map(function(l){return '- '+l;}).join('\n'):'- (바뀐 내용 없음)')+'\n';}
var LOGF='작업기록.md';
function unb64(b){var bin=atob(String(b).replace(/\s/g,'')),u=new Uint8Array(bin.length);for(var i=0;i<bin.length;i++)u[i]=bin.charCodeAt(i);return new TextDecoder().decode(u);}

/* ===== 사이트에 반영 ===== */
function used(p){var s=JSON.stringify(draft.pf||[])+JSON.stringify(draft.collab||[]);return s.indexOf('"'+p+'"')>-1;}
$('bPub').addEventListener('click',function(){
  if(!TOKEN){settings(true);return;}
  var up=Object.keys(files).filter(used);
  var size=up.reduce(function(n,p){return n+files[p].size;},0);
  var sum=[];try{sum=changeSummary();}catch(e){}
  dialog('<h3>사이트에 반영할까요?</h3><p>바뀐 문구'+(up.length?'와 새 이미지 '+up.length+'개('+(size/1048576).toFixed(1)+'MB)':'')+'를 GitHub에 올려요. 1~2분 뒤 페이지에 적용돼요.</p><div class="sumbox"><b>자동 작업 메모</b> <span class="note">(반영하면 저장소의 작업기록.md에 날짜와 함께 남아요)</span><ul>'+(sum.length?sum.slice(0,30).map(function(l){return '<li>'+esc(l)+'</li>';}).join('')+(sum.length>30?'<li>외 '+(sum.length-30)+'건</li>':''):'<li>바뀐 내용이 없어요</li>')+'</ul></div><label class="f"><span>한 줄 메모 덧붙이기 (선택)</span><input id="dM" placeholder="예) 11월 가격 조정"></label><div class="row"><button class="btn" data-x>취소</button><button class="btn y" id="dOk">반영하기</button></div>');
  $('dM').focus();$('dOk').onclick=function(){publish($('dM').value.trim(),up,false,sum);};
});
function publish(memo,up,force,sum){if(!sum){try{sum=changeSummary();}catch(e){sum=[];}}
  var total=up.length+3,n=0,step=function(t){n++;busy(t,n/total);};
  busy('GitHub에 연결하는 중…',0);
  var head,treeSha,entries=[];
  api('/git/ref/heads/'+CFG.branch).then(function(r){head=r.object.sha;return api('/git/commits/'+head);}).then(function(c){treeSha=c.tree.sha;
    if(force||baseSha===undefined)return null;
    return api('/contents/content.json?ref='+head,{allow404:true}).then(function(j){var remote=j?j.sha:null;if(remote!==baseSha){var e=new Error('conflict');e.conflict=1;throw e;}});
  }).then(function(){
    var p=Promise.resolve();
    up.forEach(function(path,i){p=p.then(function(){step('이미지 올리는 중… ('+(i+1)+'/'+up.length+')');return blob64(files[path]).then(function(b){return api('/git/blobs',{method:'POST',body:{content:b,encoding:'base64'}});}).then(function(r){entries.push({path:path,mode:'100644',type:'blob',sha:r.sha});});});});
    return p;
  }).then(function(){return api('/contents/'+encodeURIComponent(LOGF)+'?ref='+head,{allow404:true}).then(function(j){var old=j&&j.content?unb64(j.content):'# 관리자 페이지 작업 기록\n\n관리자 페이지에서 사이트에 반영할 때마다 바뀐 내용이 자동으로 위쪽에 쌓여요.\n\n';var i=old.indexOf('\n## ');var nw=i>-1?old.slice(0,i+1)+logEntry(memo,sum)+'\n'+old.slice(i+1):old.replace(/\s*$/,'\n\n')+logEntry(memo,sum);return api('/git/blobs',{method:'POST',body:{content:b64str(nw),encoding:'base64'}});}).then(function(r){entries.push({path:LOGF,mode:'100644',type:'blob',sha:r.sha});}).catch(function(){});
  }).then(function(){step('문구 저장하는 중…');var json=JSON.stringify(draft,null,1);return api('/git/blobs',{method:'POST',body:{content:b64str(json),encoding:'base64'}}).then(function(r){entries.push({path:'content.json',mode:'100644',type:'blob',sha:r.sha});baseShaNext=r.sha;});})
  .then(function(){return api('/git/trees',{method:'POST',body:{base_tree:treeSha,tree:entries}});})
  .then(function(t){step('반영하는 중…');return api('/git/commits',{method:'POST',body:{message:'관리자 페이지에서 수정: '+(memo||(sum.length?sum.slice(0,2).join(' / ')+(sum.length>2?' 외 '+(sum.length-2)+'건':''):'변경 없음'))+(sum.length?'\n\n'+sum.map(function(l){return '- '+l;}).join('\n'):''),tree:t.sha,parents:[head]}});})
  .then(function(c){return api('/git/refs/heads/'+CFG.branch,{method:'PATCH',body:{sha:c.sha}});})
  .then(function(){
    baseSha=baseShaNext;base=clone(draft);dirty=false;
    up.forEach(function(p){delete files[p];});
    clearLocal();unbusy();setStatus('반영 완료 · 사이트 적용 기다리는 중…','ok');
    dialog('<h3>반영했어요 ✦</h3><p>GitHub에 저장됐어요. 페이지에 적용되기까지 보통 1~2분 걸려요. 적용되면 여기서 알려 드릴게요.</p><div class="row"><a class="btn" href="'+esc(CFG.site)+'" target="_blank" rel="noopener" style="display:inline-flex;align-items:center;text-decoration:none;color:inherit">사이트 열기</a><button class="btn y" data-x>확인</button></div>');
    waitLive(JSON.stringify(draft));
  }).catch(function(e){unbusy();
    if(e.conflict){dialog('<h3>다른 곳에서 먼저 바뀌었어요</h3><p>이 관리자 페이지를 연 뒤에 사이트 내용이 다른 곳(다른 기기·창)에서 반영됐어요. 지금 내용으로 덮어쓰면 그 변경은 사라져요.</p><div class="row"><button class="btn" data-x>취소</button><button class="btn red" id="dOk">지금 내용으로 덮어쓰기</button></div>');$('dOk').onclick=function(){closeDlg();publish(memo,up,true);};return;}
    var m=e.status===401?'토큰이 맞지 않거나 만료됐어요. ⚙ 설정에서 다시 넣어 주세요.':e.status===403||e.status===404?'이 토큰으로는 저장소에 쓸 수 없어요. 권한(Contents: Read and write)을 확인해 주세요.':e.message;
    setStatus('반영 실패','err');dialog('<h3>반영하지 못했어요</h3><p>'+esc(m)+'</p><p class="note">작업한 내용은 이 브라우저에 임시 저장돼 있어요.</p><div class="row"><button class="btn y" data-x>확인</button></div>');});
}
var baseShaNext=null;
function waitLive(json,tries){tries=tries||0;if(tries>40){setStatus('반영 완료 (사이트 적용 확인 시간 초과 · 잠시 후 새로고침해 보세요)','ok');return;}
  setTimeout(function(){fetch('content.json?t='+Date.now(),{cache:'no-store'}).then(function(r){return r.ok?r.text():'';}).then(function(t){
    var same=false;try{same=JSON.stringify(JSON.parse(t))===json;}catch(e){}
    if(same){setStatus('사이트에 적용됨 ✓','ok');toast('사이트에 적용됐어요 ✦',4000);}else waitLive(json,tries+1);}).catch(function(){waitLive(json,tries+1);});},6000);}



/* ===== 협업 작가 안내 카드 ===== */
function collabData(){if(!draft.collab){var d=O&&O.defaults&&O.defaults.collab;draft.collab=d?clone(d):[];}return draft.collab;}
function buildCollab(){
  if(!O||!O.defaults){$('clist').innerHTML='<p class="note">미리보기를 불러오는 중이에요. 잠시 후 다시 눌러 주세요.</p>';return;}
  var L=collabData(),h='<div class="pagehead"><div><h2>협업 작가 안내</h2><p>카드마다 사진·이름·버튼 문구·색·링크·설명을 고칠 수 있어요. 설명에서 <b>**굵게**</b>로 감싸면 굵게, <b>[[15%]]</b>처럼 감싸면 카드에 마우스를 올렸을 때 강조돼요. 링크를 비우면 눌러도 이동하지 않는 카드가 돼요.</p></div><span class="sp" style="flex:1"></span><button class="btn" id="cbPrev">미리보기로 확인</button><button class="btn y" id="cbAdd">+ 카드 추가</button></div>';
  L.forEach(function(c,i){
    h+='<div class="card" data-i="'+i+'"><h4><span style="color:'+esc(c.color||'#1a1a1a')+'">'+esc(c.name||'(이름 없음)')+'</span> 작가님<span class="cbe-acts"><button class="btn" data-cb="up"'+(i?'':' disabled')+'>▲ 위로</button><button class="btn" data-cb="down"'+(i<L.length-1?'':' disabled')+'>▼ 아래로</button><button class="btn red" data-cb="del">카드 삭제</button></span></h4>'+
      '<div class="cbe"><div class="cbe-img"><div class="pic" data-cb="img" title="눌러서 사진 바꾸기">'+(c.img?'<img src="'+esc(urls[c.img]||c.img)+'" alt="">':'사진 넣기')+'</div><button class="btn" data-cb="img">사진 바꾸기</button></div>'+
      '<div class="cbe-f">'+
        '<label class="f"><span>작가 이름 (첫 줄, 색 적용)</span><input data-k="name" value="'+esc(c.name)+'"></label>'+
        '<label class="f"><span>버튼 안 문구 (색 적용)</span><input data-k="tag" value="'+esc(c.tag)+'"></label>'+
        '<label class="f"><span>색상</span><span class="cbe-col"><input type="color" data-k="color" value="'+esc(/^#[0-9a-f]{6}$/i.test(c.color||'')?c.color:'#1a1a1a')+'"><input type="text" data-k="color" value="'+esc(c.color||'')+'" placeholder="#0286ff"></span></label>'+
        '<label class="f wide"><span>작가 페이지 링크 (카드를 누르면 새 탭으로 열려요)</span><input data-k="url" value="'+esc(c.url)+'" placeholder="https://artmug.kr/..."></label>'+
        '<label class="f wide"><span>설명</span><textarea data-k="text" rows="2">'+esc(c.text)+'</textarea></label>'+
        '<label class="f wide"><span>작은 안내 (회색)</span><input data-k="note" value="'+esc(c.note)+'"></label>'+
      '</div></div></div>';
  });
  if(!L.length)h+='<div class="card"><p class="note">카드가 없어요. 카드가 하나도 없으면 페이지에서 협업 작가 안내 파트가 통째로 숨겨져요.</p></div>';
  $('clist').innerHTML=h+'<input type="file" id="cbF" accept="image/*" hidden>';
  $('cbAdd').onclick=function(){L.push({name:'새 작가',tag:'',color:'#ffd040',img:'',url:'',text:'',note:'※ 동시 신청 시에만 적용됩니다.'});collabChanged(true);setTimeout(function(){var c=$('clist').querySelectorAll('.card[data-i]');if(c.length)c[c.length-1].scrollIntoView({behavior:'smooth',block:'center'});},50);};
  $('cbPrev').onclick=function(){showView('text');setTimeout(function(){try{var el=$('pv').contentDocument.getElementById('sec-collab');if(el)el.scrollIntoView();}catch(e){}},needReload?1500:50);};
}
function collabChanged(rebuild){needReload=true;changed();if(rebuild)buildCollab();}
var cbImgIdx=null;
$('clist').addEventListener('input',function(e){var t=e.target,card=t.closest('.card[data-i]');if(!card||!t.hasAttribute('data-k'))return;var c=collabData()[+card.getAttribute('data-i')],k=t.getAttribute('data-k');
  c[k]=t.value;if(k==='color'){card.querySelectorAll('[data-k=color]').forEach(function(x){if(x!==t&&(x.type!=='color'||/^#[0-9a-f]{6}$/i.test(t.value)))x.value=t.value;});}
  if(k==='name'||k==='color'){var sp=card.querySelector('h4 span');sp.textContent=c.name||'(이름 없음)';sp.style.color=c.color||'#1a1a1a';}
  collabChanged(false);});
$('clist').addEventListener('click',function(e){var b=e.target.closest('[data-cb]');if(!b)return;var card=b.closest('.card[data-i]'),i=+card.getAttribute('data-i'),L=collabData(),a=b.getAttribute('data-cb');
  if(a==='up'&&i>0){L.splice(i-1,0,L.splice(i,1)[0]);collabChanged(true);}
  if(a==='down'&&i<L.length-1){L.splice(i+1,0,L.splice(i,1)[0]);collabChanged(true);}
  if(a==='del'){if(!confirm((L[i].name||'이')+' 카드를 삭제할까요?'))return;L.splice(i,1);collabChanged(true);}
  if(a==='img'){cbImgIdx=i;$('cbF').value='';$('cbF').click();}
});
$('clist').addEventListener('change',function(e){if(e.target.id!=='cbF')return;var f=e.target.files&&e.target.files[0];if(!f||cbImgIdx==null)return;var c=collabData()[cbImgIdx];
  decode(f).then(function(img){var w=img.width,h=img.height,m=Math.min(w,h),side=Math.min(480,m),cv=document.createElement('canvas');cv.width=cv.height=side;var x=cv.getContext('2d');x.imageSmoothingQuality='high';x.drawImage(img,Math.round((w-m)/2),Math.round((h-m)/2),m,m,0,0,side,side);return toBlob(cv,'image/webp',.88);})
  .then(function(bl){c.img=keep('portfolio/collab/collab-'+stamp()+'.webp',bl);collabChanged(true);toast('사진을 바꿨어요. 가운데를 정사각형으로 잘라 넣었어요.');},function(){toast('이미지를 열 수 없어요.');});});
/* ===== 화면 전환 ===== */
function showView(v){document.querySelectorAll('.nav button').forEach(function(b){var bv=b.getAttribute('data-v');b.classList.toggle('on',bv===v&&(v!=='text'||(b.getAttribute('data-sec')||'')===secF)&&(v!=='items'||!b.parentNode.classList.contains('navsub')||b.getAttribute('data-grp')===grpF));});document.querySelectorAll('.view').forEach(function(s){s.classList.toggle('on',s.id==='v-'+v);});
  if(v==='text'&&needReload)reloadPreview();if(v==='items')buildItems();if(v==='price')buildPrice();if(v==='pf'&&!pfReady)initPf();if(v==='collab')buildCollab();}
document.querySelector('.nav').addEventListener('click',function(e){var b=e.target.closest('[data-v]');if(!b)return;var v=b.getAttribute('data-v');if(v==='text')secF=b.getAttribute('data-sec')||'';if(v==='items'){var ng=b.getAttribute('data-grp')||'p';if(ng!==grpF)curItem=null;grpF=ng;}showView(v);if(v==='text'){buildTextList();goSec();}});
window.addEventListener('beforeunload',function(e){if(dirty){saveLocal(true);e.preventDefault();e.returnValue='';}});

/* ===== 시작 ===== */
loadRemote().then(function(r){
  base=clone(r.c);baseSha=r.sha;draft=clone(r.c);
  var L=loadLocal();
  var go=function(){reloadPreview();setStatus(r.warn?(TOKEN?'사이트 파일로 불러옴 (GitHub 연결 확인 필요)':'사이트 파일로 불러옴 · ⚙에서 토큰을 넣어 주세요'):'최신 내용 불러옴',r.warn?'err':'ok');if(!TOKEN)setTimeout(function(){settings(true);},600);};
  if(L&&L.draft&&JSON.stringify(L.draft)!==JSON.stringify(r.c)){
    dialog('<h3>임시 저장된 작업이 있어요</h3><p>'+new Date(L.at).toLocaleString('ko-KR')+'에 이 브라우저에 저장된, 아직 사이트에 반영하지 않은 작업이에요. 이어서 할까요?</p>'+(L.baseSha!==r.sha&&L.baseSha!==undefined?'<p class="note" style="color:#d93025">그 뒤에 사이트 내용이 바뀌었어요. 이어서 하면 바뀐 내용 위에 덮어쓸 수 있어요.</p>':'')+'<div class="row"><button class="btn" id="dN">버리고 새로 시작</button><button class="btn y" id="dOk">이어서 하기</button></div>');
    $('dN').onclick=function(){clearLocal();closeDlg();go();};
    $('dOk').onclick=function(){draft=norm(L.draft);idb('readonly',function(st){var req=st.getAll(),keys=st.getAllKeys();return {r:req,k:keys};}).then(function(x){var vals=x.r.result||[],ks=x.k.result||[];ks.forEach(function(k,i){keep(k,vals[i]);});}).catch(function(){}).then(function(){closeDlg();dirty=true;setStatus('반영 안 된 변경 사항 있음','dirty');reloadPreview();});};
  }else go();
});
})();
</script>
